<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Community Health Clinic</title>
  <link rel="icon" href="images/first-aid-box_6705669.png" type="image/png" />
  <link rel="stylesheet" href="styles/auth.css" />
</head>
<body class="auth-page">

  <div class="form-container">
    <div class="auth-brand">
      <img src="images/first-aid-box_6705669.png" alt="Clinic Logo" />
      <span>Join ClinicCare</span>
    </div>
    <h2>Register</h2>
    <form class="loginForm auth-form">
      <input type="text" name="fullname" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email Address" required />
      <input type="tel" name="phone" placeholder="10-digit mobile (starts with 6-9)" required />
      <div id="phoneError" class="field-error"></div>
      <input type="password" name="password" placeholder="Create Password" required />
      <div id="passwordError" class="field-error"></div>

      <div class="select_bar">
        <label for="role">Select Role:</label>
        <select name="role" required>
          <option value="patient">Patient</option>
          <option value="doctor">Doctor</option>
        </select>
      </div>

      <button type="submit" class="btn-primary">Sign Up</button>
    </form>
    <div id="registerError" class="form-error"></div>
    <div id="registerSuccess" class="form-success"></div>
    <div class="form-footer">
      <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="utils/auth.js"></script>
  <script src="main.js"></script>
</body>
</html>
