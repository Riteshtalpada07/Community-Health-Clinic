<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Clinic</title>
  <link rel="icon" href="images/first-aid-box_6705669.png" type="image/png" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="form-container">
    <h2>Login</h2>
    <form class="loginForm">
      <input type="email" id="username" placeholder="Email Address" required />
      <div id="usernameError" style="color:red;font-size:12px;"></div>
      <input type="password" id="password" placeholder="Password" required />
      <div id="passwordError" style="color:red;font-size:12px;"></div>
      <div class="select_bar">
        <label for="role">Login as:</label>
        <select id="role">
          <option value="patient">Patient</option>
          <option value="doctor">Doctor</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div id="roleError" style="color:red;font-size:12px;"></div>
      <button type="button" id="submit">Login</button>
    </form>
    <div id="loginError" style="color:red;margin-top:10px;"></div>
    <p style="margin-top:12px;">
      <a href="#">Forgot Password?</a>
    </p>
    <p style="margin-top:8px;">
      Don't have an account? <a href="register.html">Register</a>
    </p>
  </div>
  <script src="main.js"></script>
</body>
</html>
