<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Clinic</title>
  <link rel="icon" href="images/first-aid-box_6705669.png" type="image/png" />
  <link rel="stylesheet" href="styles/auth.css" />
</head>
<body class="auth-page">
  <div class="form-container">
    <div class="auth-brand">
      <img src="images/first-aid-box_6705669.png" alt="Clinic Logo" />
      <span>ClinicCare Portal</span>
    </div>
    <h2>Login</h2>
    <form class="loginForm auth-form">
      <input type="email" id="username" placeholder="Email Address" required />
      <div id="usernameError" class="field-error"></div>
      <input type="password" id="password" placeholder="Password" required />
      <div id="passwordError" class="field-error"></div>
      <div class="select_bar">
        <label for="role">Login as:</label>
        <select id="role">
          <option value="patient">Patient</option>
          <option value="doctor">Doctor</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div id="roleError" class="field-error"></div>
      <button type="button" id="submit" class="btn-primary">Login</button>
    </form>
    <div id="loginError" class="form-error"></div>
    <div class="form-footer">
      <p><a href="#">Forgot Password?</a></p>
      <p>Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="utils/auth.js"></script>
  <script src="main.js"></script>
</body>
</html>
